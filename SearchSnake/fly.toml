# Fly.io deployment.
#
# Two settings here matter more than anything else and are the usual reason a
# deployed snake plays worse than it does locally:
#
#   auto_stop_machines = "off" / min_machines_running = 1
#       A scaled-to-zero machine cold-starts on the first request of a game.
#       The engine's per-move deadline is 500 ms; a cold start blows straight
#       through it and the snake forfeits its first move, often the game.
#
#   primary_region
#       Every millisecond of round-trip is thinking time the snake does not
#       get. The engine runs in Oregon (US-WEST), Virginia (US-EAST) and the
#       Netherlands (EUROPE) - put the server in whichever matches the games
#       you are playing. "sea" (Seattle) is closest to Oregon; use "iad" for
#       Virginia or "ams" for the Netherlands.

app = "searchsnake"
primary_region = "sea"

[build]

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[env]
  PORT = "8000"
  THREADS = "4"
  # Held back from the engine's advertised timeout to cover network round-trip
  # and JSON handling. Raise it if the latency shown on play.battlesnake.com is
  # high; the snake will simply search less deeply and still answer in time.
  BUDGET_MARGIN_MS = "120"

# The search is single-threaded per request, so cores beyond a couple only help
# with concurrent games. Memory use is tiny - a few MB.
[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"
